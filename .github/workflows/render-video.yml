name: Create video

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Main title for the video"
        required: true
        default: "My first motion graphic"

      subtitle:
        description: "Smaller text below the title"
        required: true
        default: "Rendered by GitHub in the cloud"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Remotion
        run: npm install

      - name: Save your title and subtitle
        run: printf '%s' "$INPUTS" > input-props.json
        env:
          INPUTS: ${{ toJson(github.event.inputs) }}

      - name: Create the MP4 video
        run: npx remotion render src/index.ts PromoVideo out/video.mp4 --props=input-props.json --codec=h264

      - name: Save the finished video for download
        uses: actions/upload-artifact@v4
        with:
          name: finished-video
          path: out/video.mp4
